name: publish

# Publishing happens only from a published GitHub release (or a manual run). Pushing a tag alone
# never publishes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every check and `npm publish --dry-run` without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the leak scan reads every commit, not just the tip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Install
        run: npm ci
      - name: Release tag matches package.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$RELEASE_TAG" ]; then
            echo "::error::release tag $RELEASE_TAG does not match package.json version $expected" >&2
            exit 1
          fi
      - name: Full check
        run: npm run check
      - name: Pack the exact tarball to publish
        id: pack
        run: |
          set -euo pipefail
          file="$(npm pack --json --pack-destination "$RUNNER_TEMP" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename)")"
          echo "tarball=$RUNNER_TEMP/$file" >> "$GITHUB_OUTPUT"
      - name: Leak scan with the maintainers' patterns (refuses to publish without them)
        # The repository secret LEAK_PATTERNS_JSON holds the maintainers' extra leak patterns. Without
        # it this release is NOT published. Hits from those rules are redacted from the log.
        env:
          LEAK_PATTERNS_JSON: ${{ secrets.LEAK_PATTERNS_JSON }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          if [ -z "${LEAK_PATTERNS_JSON:-}" ]; then
            echo "::error::the LEAK_PATTERNS_JSON repository secret is not set; refusing to publish without the maintainers' leak patterns" >&2
            exit 1
          fi
          patterns="$(mktemp)"
          trap 'rm -f "$patterns"' EXIT
          printf '%s' "$LEAK_PATTERNS_JSON" > "$patterns"
          ULTRAROUTER_LEAK_PATTERNS_FILE="$patterns" node scripts/leak-scan.mjs --redact-external --pack-file "$TARBALL"
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --dry-run --provenance --access public
      - name: Publish to npm with provenance (the scanned tarball)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --access public
